[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-bus"
version = "0.2.0"
description = "Local, dependency-light multi-agent pointer signaling"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-bus = "agent_bus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
